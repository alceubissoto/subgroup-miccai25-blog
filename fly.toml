# fly.toml app configuration file generated for subgroup-miccai25-blog

app = "subgroup-miccai25-blog"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[[statics]]
  guest_path = "/app/static"
  url_prefix = "/static/"

[env]
  FLASK_ENV = "production"
  PYTHONUNBUFFERED = "1"